name: Qualify an exact release tag on available hosted platforms
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Core beta tag to qualify
        required: true
        type: string
      build_only:
        description: Build and qualify a candidate without native tests or publication
        default: false
        type: boolean
      macos_runner:
        description: Hosted macOS pool for native permission qualification
        type: choice
        default: macos-latest
        options: [macos-latest, macos-15-intel, macos-15]
      publish:
        description: Publish only after all native and installed engine checks pass
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  native:
    if: ${{ !inputs.build_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, "${{ inputs.macos_runner || 'macos-latest' }}", windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify the exact tag and native permission contracts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python - <<'PY_VERIFY'
          import os,re,subprocess,tomllib
          tag=os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v1\.1\.0-beta\.\d+',tag)
          version=tomllib.load(open('pyproject.toml','rb'))['project']['version']
          assert tag=='v'+version.replace('b','-beta.')
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True)==subprocess.check_output(['git','rev-parse',tag+'^{commit}'],text=True)
          PY_VERIFY
          python -m pip install --no-deps .
          python -m unittest discover -s tests/public -p test_private_paths.py -v
          python -m pip install pyyaml
          python -m unittest discover -s tests/public -p test_process_lifecycle_compatibility.py -v
  wheels:
    if: ${{ always() && (needs.native.result == 'success' || inputs.build_only) }}
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.11.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python packaging/build.py --out "$RUNNER_TEMP/release-wheels"
      - name: Qualify installed public engine and exact source provenance
        run: |
          python - <<'PY_VERIFY'
          import json,os,pathlib,subprocess
          m=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'release-wheels/manifest.json').read_text())
          assert not m['dirty_snapshot']
          assert m['repository_commit']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          PY_VERIFY
          python packaging/qualify.py --wheels "$RUNNER_TEMP/release-wheels" --environment "$RUNNER_TEMP/qualified-engine"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qualified-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/release-wheels/*
          if-no-files-found: error
          retention-days: 5
  publish:
    needs: wheels
    if: inputs.publish && !inputs.build_only && github.repository == 'openagent-uno/openagent-core'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qualified-${{ inputs.release_tag }}
          path: release-wheels
      - name: Publish the qualified exact tag without overwriting assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi
          gh release create "$RELEASE_TAG" release-wheels/* --verify-tag --prerelease --title "$RELEASE_TAG" --notes 'Exact tag qualified on Linux, macOS and Windows, plus the complete public engine suite. See manifest.json for source and artifact digests.'
