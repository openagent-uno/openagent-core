name: Native private state permission contracts
on:
  workflow_call:
  pull_request:
    paths:
      - packages/runtime/src/openagent_core/private_paths.py
      - tests/public/test_private_paths.py
      - packages/runtime/src/openagent_core/core/serve_singleton.py
      - tests/public/test_process_lifecycle_compatibility.py
      - .github/workflows/private-path-permissions.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-os:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the actual dependency-free Core wheel
        run: python -m pip install --no-deps .
      - name: Check native modes and actual Windows DACL counterexamples
        run: python -m unittest discover -s tests/public -p test_private_paths.py -v
      - name: Preserve independently owned processes during legacy host startup
        run: python -m unittest discover -s tests/public -p test_process_lifecycle_compatibility.py -v
