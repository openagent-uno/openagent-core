[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "openagent-storage-sqlite"
version = "1.1.0b152"
requires-python = ">=3.11"
dependencies = ["openagent-core==1.1.0b152"]
[project.optional-dependencies]
postgres-migration = ["psycopg>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]
