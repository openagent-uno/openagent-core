[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-storage-postgres"
version = "1.1.0b153"
requires-python = ">=3.11"
dependencies = ["openagent-core==1.1.0b153", "psycopg[pool]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openagent_storage_postgres = ["schema.sql"]
