[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openagent-modules"
version = "1.1.0b1"
description = "Prebuilt optional OpenAgent module resources"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-modules-full==1.1.0b1"]

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_modules"]
