[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openagent-modules"
version = "1.0.0b1"
description = "Prebuilt optional OpenAgent module resources"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_modules"]
exclude = ["src/openagent_modules/resources"]

[tool.hatch.build.targets.wheel.force-include]
"src/openagent_modules/resources" = "openagent_modules/resources"
