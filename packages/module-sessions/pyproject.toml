[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openagent-module-sessions"
version = "1.1.0b2"
description = "Optional OpenAgent session query and administration module"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core>=1.1.0b1,<2"]

[project.entry-points."openagent.modules"]
sessions = "openagent_module_sessions:descriptor"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_module_sessions"]
