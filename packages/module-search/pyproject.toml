[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openagent-module-search"
version = "1.1.0b1"
description = "Federated search across active OpenAgent domain modules"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core>=1.1.0b1,<2"]

[project.entry-points."openagent.modules"]
search = "openagent_module_search:descriptor"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_module_search"]
