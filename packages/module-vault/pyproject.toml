[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
[project]
name = "openagent-module-vault"
version = "1.1.0b1"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core[engine]>=1.1.0b1,<2"]
[project.entry-points."openagent.modules"]
vault = "openagent_module_vault:descriptor"
[tool.hatch.build.targets.wheel]
packages = ["src/openagent_module_vault"]
[tool.hatch.build.targets.wheel.force-include]
"src/openagent_module_vault/resources/vault/dist" = "openagent_module_vault/resources/vault/dist"
