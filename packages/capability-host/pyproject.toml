[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagent-capability-host"
version = "1.0.0b2.dev2026103002"
description = "Independent OpenAgent capability package"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-tool-protocol==1.0.0b2.dev2026103002"]

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_capability_host"]
