[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "openagent-module-models"
version = "1.1.0b1"
description = "Optional OpenAgent models module"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["openagent-core[engine]>=1.1.0b1,<2"]

[project.entry-points."openagent.modules"]
models = "openagent_module_models:descriptor"

[tool.hatch.build.targets.wheel]
packages = ["src/openagent_module_models"]
