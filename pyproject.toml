[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-core"
version = "1.0.0b1"
description = "Embeddable OpenAgent runtime and public host contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
engine = ["mcp>=1.27,<2", "pyyaml>=6", "aiosqlite>=0.20", "sqlalchemy[asyncio]>=2", "croniter>=2", "jinja2>=3.1", "httpx>=0.24", "packaging>=21", "pydantic>=2", "jsonschema>=4.20", "regex>=2024.11.6", "rich>=13", "certifi", "docstring-parser>=0.16"]
providers = ["openai>=1", "anthropic>=0.34", "google-genai>=1", "groq>=0.4"]
audio = ["litellm>=1.60,<2"]
retrieval = ["numpy>=1.24", "pypdf>=5"]
modules = ["openagent-modules==1.0.0b1"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["packages/runtime/src"]
include = ["openagent_core*"]
namespaces = false

[tool.setuptools.package-data]
openagent_core = ["prompts/*.json", "memory/operational/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/public"]
