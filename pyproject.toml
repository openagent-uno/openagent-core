[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-core"
version = "1.1.0b155"
description = "Embeddable OpenAgent runtime and public host contracts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
capabilities = ["openagent-capability-host==1.0.0b5"]
engine = ["mcp>=1.27,<2", "pyyaml>=6", "aiosqlite>=0.20", "sqlalchemy[asyncio]>=2", "croniter>=2", "jinja2>=3.1", "httpx>=0.24", "packaging>=21", "pydantic>=2", "jsonschema>=4.20", "regex>=2024.11.6", "rich>=13", "certifi", "docstring-parser>=0.16"]
providers = ["openai>=1", "anthropic>=0.34", "google-genai>=1", "groq>=0.4"]
subscriptions = ["fastapi>=0.110,<1", "httpx>=0.24,<1", "curl_cffi>=0.7,<1", "python-multipart>=0.0.20,<1", "filelock>=3.20,<4"]
subscription-host = ["openagent-core[subscriptions]==1.1.0b155", "uvicorn>=0.30,<1"]
audio = ["httpx>=0.24,<1", "litellm>=1.60,<2"]
retrieval = ["numpy>=1.24", "pypdf>=5"]
modules = ["openagent-modules==1.1.0b8"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["packages/runtime/src"]
include = ["openagent_core*"]
namespaces = false

[tool.setuptools.package-data]
openagent_core = ["subscriptions/NOTICE.txt", "prompts/*.json", "memory/operational/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/public"]
pythonpath = [
  "packages/runtime/src",
  "packages/storage-sqlite/src",
  "packages/storage-postgres/src",
  "packages/modules/src",
  "packages/gateway/src",
  "packages/capability-host/src",
  "sdk/python/src",
  "../openagent-tools/packages/execution/src",
  "../openagent-tools/packages/shell/src",
  "../openagent-tools/packages/tool-protocol/src",
  "packages/module-sessions/src",
  "packages/module-search/src",
  "packages/module-mcp/src",
  "packages/module-vault/src",
  "packages/module-tool-discovery/src",
  "packages/module-workflows/src",
  "packages/module-scheduler/src",
  "packages/module-events/src",
]
