[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-sdk"
version = "1.1.0b40"
description = "HTTP client for the OpenAgent durable run protocol"
requires-python = ">=3.11"
dependencies = ["openagent-core==1.1.0b40"]

[project.optional-dependencies]
capabilities = ["openagent-capability-host==1.0.0b3"]

[tool.setuptools.packages.find]
where = ["src"]
