[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openagent-sdk"
version = "1.1.0b2"
description = "HTTP client for the OpenAgent durable run protocol"
requires-python = ">=3.11"
dependencies = ["openagent-core==1.1.0b5"]

[tool.setuptools.packages.find]
where = ["src"]
